[project]
name = "project3"
version = "0.1.0"
description = "MDM Advanced RAG — Product Attribute Extraction Pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # LLM
    "anthropic>=0.40.0",
    "instructor>=1.6.0",

    # Embeddings
    "openai>=1.50.0",

    # Document parsing
    "pdfplumber>=0.11.0",
    "pypdf>=4.3.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "unstructured>=0.15.0",

    # Vector store
    "qdrant-client>=1.11.0",

    # Retrieval
    "rank-bm25>=0.2.2",
    "flashrank>=0.2.9",
    "langchain-text-splitters>=0.3.0",

    # Validation and config
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",

    # Async / reliability
    "tenacity>=9.0.0",
    "aiofiles>=24.1.0",

    # Workflow and export
    "pandas>=2.2.0",

    # UI
    "streamlit>=1.39.0",

    # Logging and progress
    "loguru>=0.7.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
pythonpath = ["."]
