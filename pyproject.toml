[project]
name = "mdm-advanced-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # LLM
    "anthropic>=0.40.0",
    "instructor>=1.6.0",
    # Embeddings
    "openai>=1.50.0",
    # Document parsing
    "pdfplumber>=0.11.0",
    "pypdf>=4.3.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    # Vector store
    "qdrant-client>=1.11.0",
    # Retrieval
    "rank-bm25>=0.2.2",
    "langchain-text-splitters>=0.3.0",
    # Validation and config
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    # Async / reliability
    "tenacity>=9.0.0",
    "aiofiles>=24.1.0",
    # Workflow
    "pandas>=2.2.0",
    # Logging / CLI
    "loguru>=0.7.0",
    "tqdm>=4.66.0",
    # Local embeddings
    "sentence-transformers>=3.0.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.2",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
pythonpath = ["."]


